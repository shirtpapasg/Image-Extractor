<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>
PDF Image Extractor
</title>

<style>

body{

font-family:Arial;
max-width:900px;
margin:auto;
padding:40px;
text-align:center;

}

h1{

margin-bottom:40px;

}

#drop{

border:3px dashed gray;
padding:60px;
font-size:22px;
cursor:pointer;
border-radius:10px;

}

button{

padding:15px 25px;
font-size:18px;
margin-top:25px;
cursor:pointer;

}

#status{

margin-top:20px;
font-size:18px;

}

#results{

margin-top:40px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;

}

.card{

border:1px solid #ccc;
padding:10px;
width:220px;

}

.card img{

max-width:200px;

}

</style>

</head>

<body>

<h1>

PDF Image Extractor

</h1>

<div id="drop">

Click Here To Select PDF

</div>

<input
type="file"
id="pdfInput"
accept=".pdf"
style="display:none;"
>

<br>

<button id="extract">

Extract Images

</button>

<div id="status"></div>

<div id="results"></div>

<script type="module" src="app.js"></script>

</body>

</html>
